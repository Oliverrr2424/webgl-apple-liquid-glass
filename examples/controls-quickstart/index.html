<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liquid Glass Controls Quickstart</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      color: #f5f7fb;
      background: radial-gradient(circle at 50% 0%, #22436c, #07101d 70%);
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(92vw, 760px); text-align: center; }
    h1 { margin: 0 0 8px; font-size: 30px; }
    p { margin: 0 0 22px; color: rgba(235,241,251,.7); }
    .demo {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 26px;
    }
    #navbar { width: 360px; height: 144px; border-radius: 34px; overflow: hidden; }
    #toggle { width: 230px; height: 150px; border-radius: 34px; overflow: hidden; }
    output { display: block; min-height: 24px; margin-top: 18px; color: #a9cbff; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "apple-liquid-glass-webgl/controls": "./node_modules/apple-liquid-glass-webgl/src/controls.js"
      }
    }
  </script>
</head>
<body>
  <main>
    <h1>Ready-made Liquid Glass controls</h1>
    <p>Drag either control, or focus it and use the arrow/space keys.</p>
    <div class="demo">
      <div id="navbar"></div>
      <div id="toggle"></div>
    </div>
    <output id="state" aria-live="polite"></output>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
