<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      html, body { margin: 0; background: rgb(12, 180, 70); }
      #output { display: block; width: 320px; height: 200px; }
    </style>
  </head>
  <body>
    <canvas id="output"></canvas>
    <script type="module">
      import { LiquidGlassWebGL } from '../src/index.js';

      const nextFrames = (count = 3) => new Promise((resolve) => {
        const step = () => count-- > 0 ? requestAnimationFrame(step) : resolve();
        requestAnimationFrame(step);
      });

      const fill = (context, color) => {
        context.fillStyle = color;
        context.fillRect(0, 0, context.canvas.width, context.canvas.height);
      };

      const distance = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);

      window.runTest = async () => {
        const source = document.createElement('canvas');
        source.width = 320;
        source.height = 200;
        const sourceContext = source.getContext('2d');
        const output = document.querySelector('#output');
        // Reading pixels back after the compositor has run requires the drawing
        // buffer to survive the frame.
        const glass = new LiquidGlassWebGL(output, {
          compositeMode: 'overlay',
          preserveDrawingBuffer: true,
        });
        glass.setElements([
          { id: 'surface', shape: 'rect', x: 60, y: 35, width: 200, height: 130 },
        ], false);

        const sample = (x, y) => {
          const gl = glass.renderer.gl;
          const dpr = gl.drawingBufferWidth / output.clientWidth;
          const pixel = new Uint8Array(4);
          gl.readPixels(
            Math.round(x * dpr),
            gl.drawingBufferHeight - Math.round(y * dpr) - 1,
            1,
            1,
            gl.RGBA,
            gl.UNSIGNED_BYTE,
            pixel,
          );
          return Array.from(pixel);
        };

        fill(sourceContext, '#d02020');
        glass.setBackdrop(source);
        await nextFrames();
        const liveBefore = sample(160, 100);
        const transparentOutside = sample(10, 10);

        fill(sourceContext, '#2040d0');
        await nextFrames();
        const liveAfter = sample(160, 100);
        glass.stop();

        fill(sourceContext, '#24b04a');
        glass.setBackdrop(source, { update: 'static', autoStart: false, shouldRender: false });
        glass.render();
        const staticBefore = sample(160, 100);
        fill(sourceContext, '#d0b020');
        glass.render();
        const staticWithoutRefresh = sample(160, 100);
        glass.updateBackdrop(false).render();
        const staticAfterRefresh = sample(160, 100);
        glass.destroy();

        const liveDistance = distance(liveBefore, liveAfter);
        const staticDistance = distance(staticBefore, staticWithoutRefresh);
        const manualDistance = distance(staticBefore, staticAfterRefresh);

        if (transparentOutside[3] !== 0) {
          throw new Error(`overlay framebuffer is not transparent outside the glass: ${transparentOutside}`);
        }
        if (liveDistance < 80) {
          throw new Error(`live canvas changes did not reach the glass: ${liveDistance}`);
        }
        if (staticDistance > 8) {
          throw new Error(`static backdrop changed without an explicit refresh: ${staticDistance}`);
        }
        if (manualDistance < 80) {
          throw new Error(`manual backdrop refresh did not update the texture: ${manualDistance}`);
        }

        return { checks: ['live', 'static', 'manual refresh', 'overlay alpha'] };
      };
    </script>
  </body>
</html>
