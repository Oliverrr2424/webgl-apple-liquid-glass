<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; background: linear-gradient(90deg, #174e85, #d88242); height: 100vh; }
  #navbar { position: absolute; left: 40px; top: 30px; width: 320px; height: 64px; }
  #toggle { position: absolute; left: 60px; top: 170px; }
</style>
<div id="navbar"></div>
<div id="toggle"></div>
<script type="module">
  import {
    LiquidGlassNavbar, LiquidGlassSwitch, PRESSED_CONTROL_MATERIAL_V2,
  } from '../src/controls.js';

  let navChange = null;
  let switchChange = null;
  const navbar = new LiquidGlassNavbar('#navbar', {
    items: [
      { value: 'gallery', label: 'Gallery', icon: '▣' },
      { value: 'featured', label: 'Featured', icon: '▰' },
      { value: 'saved', label: 'Saved' },
    ],
    value: 'gallery',
    onChange: (value) => { navChange = value; },
  });
  const toggle = new LiquidGlassSwitch(document.querySelector('#toggle'), {
    checked: false,
    onChange: (value) => { switchChange = value; },
  });
  await Promise.all([navbar.ready, toggle.ready]);

  const alphaAt = (canvas, x, y) => {
    const copy = document.createElement('canvas');
    copy.width = canvas.width;
    copy.height = canvas.height;
    const context = copy.getContext('2d');
    context.drawImage(canvas, 0, 0);
    return context.getImageData(x, y, 1, 1).data[3];
  };

  window.runTest = async () => {
    if (document.querySelectorAll('#navbar canvas').length !== 4) throw new Error('navbar layers not mounted');
    if (document.querySelectorAll('#toggle canvas').length !== 3) throw new Error('switch layers not mounted');
    if (navbar.value !== 'gallery') throw new Error('initial navbar value lost');
    if (toggle.checked) throw new Error('initial switch state lost');
    if (navbar.pressGlass.material.refraction !== PRESSED_CONTROL_MATERIAL_V2.refraction) {
      throw new Error('navbar pressed material is not fixed');
    }
    // The control is sized by its container and is transparent around it.
    const toggleBox = document.querySelector('#toggle').getBoundingClientRect();
    if (toggleBox.width !== 92 || toggleBox.height !== 40) throw new Error(`unsized switch got ${toggleBox.width}x${toggleBox.height}`);
    if (navbar.track.w !== 320 || navbar.track.h !== 64) throw new Error('navbar track does not follow its container');
    const { dpr, bleed } = navbar.size;
    // A WebGL canvas can only be read in the same task that drew it.
    navbar.staticDirty = true;
    navbar.render();
    if (alphaAt(navbar.baseCanvas, Math.round(bleed * 0.5 * dpr), Math.round(bleed * 0.5 * dpr)) !== 0) {
      throw new Error('navbar paints outside its track');
    }
    if (alphaAt(navbar.baseCanvas, Math.round((bleed + 160) * dpr), Math.round((bleed + 32) * dpr)) < 250) {
      throw new Error('navbar track glass is missing');
    }
    if (navbar.labelLayer.children.length !== 3) throw new Error('three navbar items not rendered');

    navbar.container.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
    navbar.container.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
    toggle.container.dispatchEvent(new KeyboardEvent('keydown', { key: ' ', bubbles: true }));
    await new Promise((resolve) => setTimeout(resolve, 80));
    if (navbar.value !== 'saved' || navChange !== 'saved') throw new Error(`navbar keyboard change failed: ${navbar.value}`);
    if (!toggle.checked || switchChange !== true) throw new Error('switch keyboard change failed');
    if (navbar.container.getAttribute('role') !== 'tablist') throw new Error('navbar role missing');
    if (toggle.container.getAttribute('aria-checked') !== 'true') throw new Error('switch aria state missing');
    if (LiquidGlassNavbar.from('#navbar') !== navbar) throw new Error('from() lookup failed');
    navbar.setValue('featured');
    if (navbar.value !== 'featured') throw new Error('setValue failed');
    navbar.destroy();
    toggle.destroy();
    if (document.querySelector('#navbar canvas')) throw new Error('navbar destroy leaked layers');
    if (document.querySelector('#toggle').style.width) throw new Error('switch destroy kept its default size');
    return { checks: ['navbar N items/change/destroy', 'switch mount/change/destroy', 'transparent around track', 'fixed press material'] };
  };
</script>
