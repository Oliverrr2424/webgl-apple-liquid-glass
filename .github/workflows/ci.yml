name: CI

on:
  pull_request:
  # Called by the publish workflow so a release cannot skip the gate.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm run test:unit

      - name: Browser tests
        run: npm run test:browser

      # The visual runner forces deterministic SwiftShader rendering. Its Linux
      # Subzero baseline remains distinct from macOS's LLVM rounding output.
      # Keep snapshots advisory: GPU/driver changes can move pixels without a
      # functional regression, while unit and browser tests remain blocking.
      - name: Visual regression
        id: visual
        continue-on-error: true
        run: npm run test:visual

      - name: Verify the published file list
        run: npm run pack:check

      - name: Upload rejected frames
        if: steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rejected-frames
          path: shots/tmp-*.png
          if-no-files-found: ignore
