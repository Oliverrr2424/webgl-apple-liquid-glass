name: CI

on:
  pull_request:
  workflow_dispatch:
  # Called by the publish workflow, which is what runs these tests on main.
  # Triggering on `push: main` as well would start a second, identical run
  # that the concurrency group below then cancelled, leaving every release
  # with a cancelled CI run next to a green one.
  workflow_call:

permissions:
  contents: read

# A newer commit supersedes an older run. This keeps the required check useful
# on active pull requests instead of queueing several identical Chromium jobs.
# The workflow name is part of the group so a release's called run never
# cancels a run of this workflow, or the other way round.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # These are the blocking checks. They do not depend on a GPU and cover
      # the package logic, the browser/WebGL lifecycle, and the npm contents.
      - name: Run unit tests
        run: npm run test:unit

      - name: Run browser tests
        run: npm run test:browser

      - name: Verify the published file list
        run: npm run pack:check

      # The visual runner forces deterministic SwiftShader rendering. Its Linux
      # Subzero baseline remains distinct from macOS's LLVM rounding output.
      # Keep snapshots advisory: GPU/driver changes and font rasterisation can
      # move pixels without a functional regression. The rejected frames are
      # still uploaded for review against the supplied reference screenshots.
      - name: Compare visual references
        id: visual
        continue-on-error: true
        run: npm run test:visual

      - name: Upload rejected frames
        if: always() && steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-review
          path: shots/tmp-*.png
          if-no-files-found: ignore
